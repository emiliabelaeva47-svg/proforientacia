<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Навигатор | Cyberpunk Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Syncopate:wght@700&display=swap');

        :root {
            --bg-dark: #090514;
            --bg-panel: rgba(25, 15, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-pink: #ff2a75;
            --neon-purple: #8a2be2;
            --neon-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #a09eb0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            /* Имитация неонового фона и свечения */
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(255, 42, 117, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Тонкая сетка на фоне */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            width: 100%;
        }

        /* Шапка */
        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            padding-top: 20px;
        }

        header h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 3.5em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: white;
            text-shadow: 0 0 20px rgba(255, 42, 117, 0.8), 0 0 40px rgba(138, 43, 226, 0.6);
        }

        header h1 span {
            color: var(--neon-pink);
        }

        header p {
            font-size: 1em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        /* Навигация (в стиле кнопок из референса) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            position: relative;
        }

        .nav-tabs button {
            padding: 14px 40px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            background: transparent;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-tabs button:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 42, 117, 0.4);
            background: rgba(255, 42, 117, 0.05);
        }

        .nav-tabs button.active {
            background: linear-gradient(90deg, rgba(255, 42, 117, 0.2) 0%, rgba(138, 43, 226, 0.2) 100%);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 42, 117, 0.5), inset 0 0 10px rgba(255, 42, 117, 0.3);
            color: white;
        }

        /* Секции */
        .section {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* Карточки профессий (Glassmorphism) */
        .professions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        .profession-card {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profession-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(255, 42, 117, 0.1), transparent 50%);
            pointer-events: none;
        }

        .profession-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3), 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .profession-card h3 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
        }

        .profession-card h3::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background: var(--neon-pink);
            margin-top: 10px;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .profession-card h4 {
            color: var(--neon-blue);
            margin-top: 25px;
            margin-bottom: 12px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .profession-card p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 0.95em;
            position: relative;
            z-index: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .profession-card:hover .tag {
            border-color: rgba(0, 210, 255, 0.3);
            background: rgba(0, 210, 255, 0.1);
            color: var(--neon-blue);
        }

        /* Тест */
        .quiz-container {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            margin: 0 auto;
        }

        .quiz-container h2 {
            color: white;
            margin-bottom: 15px;
            text-align: center;
            font-size: 2em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-container > p {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1em;
        }

        .question {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s;
        }

        .question:hover {
            border-color: rgba(138, 43, 226, 0.3);
        }

        .question h4 {
            color: var(--neon-pink);
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .options label {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .options label:hover {
            background: rgba(138, 43, 226, 0.1);
            border-color: var(--neon-purple);
            transform: translateX(5px);
        }

        .options input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin-right: 15px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .options input[type="radio"]:checked {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .options input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        .options input[type="radio"]:checked + span {
            color: white;
            font-weight: 600;
        }

        .options span {
            color: var(--text-muted);
            transition: color 0.3s;
        }

        /* Кнопка */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(255, 42, 117, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(255, 42, 117, 0.8), 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Результат */
        .result-box {
            display: none;
            margin-top: 40px;
            padding: 40px;
            background: rgba(255, 42, 117, 0.1);
            border: 1px solid var(--neon-pink);
            border-radius: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(255, 42, 117, 0.2), 0 0 30px rgba(255, 42, 117, 0.2);
        }

        .result-box.show {
            display: block;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-box h3 {
            font-size: 1em;
            margin-bottom: 10px;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .result-box .profession-name {
            font-size: 2.2em;
            font-weight: 800;
            margin: 15px 0;
            position: relative;
            z-index: 1;
            color: white;
            text-shadow: 0 0 20px rgba(255, 42, 117, 0.6);
        }

        .result-box p {
            font-size: 1em;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2em; }
            .professions-grid { grid-template-columns: 1fr; }
            .quiz-container { padding: 25px; }
            .nav-tabs { flex-direction: column; }
            .nav-tabs button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IT <span>CREATORS</span></h1>
            <p>Изучи современные направления и найди своё призвание в цифровой среде</p>
        </header>

        <div class="nav-tabs">
            <button class="active" onclick="showSection('professions', this)">Профессии</button>
            <button onclick="showSection('quiz', this)">Тест на профориентацию</button>
        </div>

        <!-- Секция: Профессии -->
        <section id="professions" class="section active">
            <div class="professions-grid" id="professionsGrid"></div>
        </section>

        <!-- Секция: Тест -->
        <section id="quiz" class="section">
            <div class="quiz-container">
                <h2>Найди своё направление</h2>
                <p>Ответь на несколько вопросов, чтобы понять, какая сфера тебе ближе всего</p>
                <div id="quizQuestions"></div>
                <button class="btn-primary" onclick="calculateResult()">Показать результат</button>
                <div class="result-box" id="resultBox">
                    <h3>Тебе отлично подойдёт:</h3>
                    <div class="profession-name" id="resultProfession"></div>
                    <p id="resultDescription"></p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ==================== ДАННЫЕ ====================
        const professions = [
            {
                id: "frontend",
                title: "Веб-разработчик интерфейсов",
                tasks: "Создание визуальной части сайтов и приложений. Работа с макетами, анимациями и адаптацией под разные экраны.",
                skills: ["Вёрстка", "Языки сценариев", "Адаптивность", "Основы дизайна"],
                tools: ["HTML", "CSS", "JavaScript", "React", "Figma"],
                interests: ["design", "code", "web"]
            },
            {
                id: "backend",
                title: "Серверный разработчик",
                tasks: "Проектирование внутренней логики приложений, работа с базами данных и обеспечение безопасности.",
                skills: ["Серверные языки", "Базы данных", "Архитектура", "Алгоритмы"],
                tools: ["Python", "Node.js", "SQL", "Docker", "API"],
                interests: ["code", "logic", "data"]
            },
            {
                id: "datascientist",
                title: "Специалист по данным",
                tasks: "Анализ больших массивов информации, построение моделей машинного обучения и поиск скрытых закономерностей.",
                skills: ["Аналитика", "Статистика", "Математика", "Логика"],
                tools: ["Python", "Pandas", "TensorFlow", "Jupyter", "SQL"],
                interests: ["data", "math", "logic"]
            },
            {
                id: "devops",
                title: "Инженер инфраструктуры",
                tasks: "Настройка серверов, автоматизация процессов обновления и мониторинг стабильности работы систем.",
                skills: ["Сетевые технологии", "Автоматизация", "Безопасность", "Внимательность"],
                tools: ["Linux", "Docker", "Kubernetes", "Git", "Terraform"],
                interests: ["sysadmin", "logic", "code"]
            },
            {
                id: "designer",
                title: "Продуктовый дизайнер",
                tasks: "Создание удобных и эстетичных интерфейсов, исследование поведения пользователей и разработка прототипов.",
                skills: ["Композиция", "Типографика", "Психология", "Внимание к деталям"],
                tools: ["Figma", "Sketch", "Miro", "Photoshop"],
                interests: ["design", "psychology", "web"]
            },
            {
                id: "qa",
                title: "Инженер по качеству",
                tasks: "Проверка программ на наличие ошибок, написание сценариев тестирования и контроль качества продукта.",
                skills: ["Внимательность", "Аналитическое мышление", "Документация"],
                tools: ["Selenium", "Postman", "Jira", "Python"],
                interests: ["logic", "code", "testing"]
            },
            {
                id: "mobile",
                title: "Разработчик мобильных приложений",
                tasks: "Создание программ для смартфонов, оптимизация производительности и публикация в магазинах приложений.",
                skills: ["Мобильные языки", "Дизайн интерфейсов", "Оптимизация"],
                tools: ["Swift", "Kotlin", "Flutter", "Firebase"],
                interests: ["code", "mobile", "design"]
            },
            {
                id: "security",
                title: "Специалист по безопасности",
                tasks: "Защита информации от несанкционированного доступа, аудит уязвимостей и предотвращение атак.",
                skills: ["Криптография", "Сети", "Анализ угроз", "Логика"],
                tools: ["Linux", "Wireshark", "Burp Suite", "Nmap"],
                interests: ["sysadmin", "logic", "security"]
            }
        ];

        // ==================== РЕНДЕР ====================
        function renderProfessions() {
            const grid = document.getElementById('professionsGrid');
            grid.innerHTML = professions.map(p => `
                <div class="profession-card">
                    <h3>${p.title}</h3>
                    
                    <h4>Рабочие задачи</h4>
                    <p>${p.tasks}</p>
                    
                    <h4>Необходимые навыки</h4>
                    <div class="tags">
                        ${p.skills.map(s => `<span class="tag">${s}</span>`).join('')}
                    </div>
                    
                    <h4>Инструменты</h4>
                    <div class="tags">
                        ${p.tools.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // ==================== ТЕСТ ====================
        const quizData = [
            {
                question: "Чем тебе больше нравится заниматься?",
                options: [
                    { text: "Придумывать внешний вид и анимации", value: "design" },
                    { text: "Решать сложные головоломки и задачи", value: "logic" },
                    { text: "Искать закономерности в цифрах", value: "data" },
                    { text: "Настраивать и улучшать работу систем", value: "sysadmin" }
                ]
            },
            {
                question: "Какой предмет был самым любимым?",
                options: [
                    { text: "Информатика", value: "code" },
                    { text: "Математика", value: "math" },
                    { text: "Рисование или творчество", value: "design" },
                    { text: "Обществознание и психология", value: "psychology" }
                ]
            },
            {
                question: "Что вызывает у тебя наибольший интерес?",
                options: [
                    { text: "Красивые сайты и удобные сервисы", value: "web" },
                    { text: "Современные гаджеты и приложения", value: "mobile" },
                    { text: "Защита личных данных и приватность", value: "security" },
                    { text: "Искусственный интеллект и наука", value: "data" }
                ]
            },
            {
                question: "Как тебе комфортнее работать?",
                options: [
                    { text: "В постоянном общении с людьми", value: "communication" },
                    { text: "В полной тишине и одиночестве", value: "focus" },
                    { text: "По чёткому плану и инструкциям", value: "structure" },
                    { text: "Обсуждая идеи с командой", value: "teamwork" }
                ]
            },
            {
                question: "Какая задача кажется самой интересной?",
                options: [
                    { text: "Сделать так, чтобы всё работало идеально", value: "testing" },
                    { text: "Создать удобный и понятный интерфейс", value: "design" },
                    { text: "Обучить программу предсказывать события", value: "data" },
                    { text: "Написать код для новой функции", value: "code" }
                ]
            }
        ];

        function renderQuiz() {
            const container = document.getElementById('quizQuestions');
            container.innerHTML = quizData.map((q, i) => `
                <div class="question">
                    <h4>${i + 1}. ${q.question}</h4>
                    <div class="options">
                        ${q.options.map(opt => `
                            <label>
                                <input type="radio" name="q${i}" value="${opt.value}">
                                <span>${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function calculateResult() {
            const answers = {};
            let answered = 0;
            quizData.forEach((_, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected) {
                    answers[selected.value] = (answers[selected.value] || 0) + 1;
                    answered++;
                }
            });

            if (answered < quizData.length) {
                alert('Пожалуйста, ответь на все вопросы.');
                return;
            }

            let bestMatch = professions[0];
            let bestScore = -1;

            professions.forEach(prof => {
                let score = 0;
                prof.interests.forEach(interest => {
                    score += answers[interest] || 0;
                });
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = prof;
                }
            });

            const resultBox = document.getElementById('resultBox');
            document.getElementById('resultProfession').textContent = bestMatch.title;
            document.getElementById('resultDescription').textContent = bestMatch.tasks;
            
            resultBox.classList.remove('show');
            void resultBox.offsetWidth; // Триггер перезапуска анимации
            resultBox.classList.add('show');
            
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==================== НАВИГАЦИЯ ====================
        function showSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderProfessions();
            renderQuiz();
        });
    </script>
</body>
</html>
